<!doctype html>
<html lang="ja" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>モーショングラフィックスの雛形</title>
    <!-- 書体は Google Fonts から読む（HyperFrames は書き出しで取り込む）。手元の書体にするなら、各場面ファイルにも @font-face を書く -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;800&display=block" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script src="assets/scenes.js"></script>
    <script src="assets/parts.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
      #main { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--ink); font-family: "Noto Sans JP", sans-serif; }
    </style>
  </head>
  <body>
    <div id="main" data-composition-id="main" data-start="0" data-duration="20" data-fps="30" data-width="1920" data-height="1080">
      <!-- 場面のクリップ。窓（data-start・data-duration）は content.json の scenes から scene-windows.ts --write が書く。手で直さない。
           場面の順・長さを変えたら作り直す（check-scenes.ts が食い違いを止める） -->
      <!-- scenes:begin -->
      <div id="title" data-composition-id="title" data-composition-src="compositions/title.html" data-start="0" data-duration="4.5" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="items" data-composition-id="items" data-composition-src="compositions/items.html" data-start="4" data-duration="5.2" data-track-index="2" data-width="1920" data-height="1080"></div>
      <div id="focus" data-composition-id="focus" data-composition-src="compositions/focus.html" data-start="9" data-duration="6.75" data-track-index="3" data-width="1920" data-height="1080"></div>
      <div id="ending" data-composition-id="ending" data-composition-src="compositions/ending.html" data-start="15.5" data-duration="4.5" data-track-index="4" data-width="1920" data-height="1080"></div>
      <!-- scenes:end -->
      <!-- 場面の切り替えの帯と、左上に残る見出し（尺いっぱいの窓で、どの場面よりも手前に描く） -->
      <div id="heads" data-composition-id="heads" data-composition-src="compositions/heads.html" data-start="0" data-duration="20" data-track-index="9" data-width="1920" data-height="1080"></div>
      <!-- 曲を決めたら、music.json の file と同じ src の audio 要素をここに置く（data-start 0・data-duration は尺・data-track-index 10。
           鳴り終わり markers.ringOut の後の響きは data-automation の音量で尺までに絞る） -->
    </div>
    <script>
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
