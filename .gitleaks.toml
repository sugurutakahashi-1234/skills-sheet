# commit の前の秘密の検知（gitleaks）の除外。rulesync でスキルを取り込むリポジトリにだけ、.gitleaks.toml として写す。
# 既定のルール一式は残す（Anthropic・GitHub・AWS・Slack などのキーは、既定のルールで検知する）。
[extend]
useDefault = true

# rulesync で取り込んだ外部のスキル（.curated/）と、その生成物（.claude/skills・.agents/skills）は見ない。
# 公開して使う前提の値（PostHog の公開キー・OAuth の利用者 ID）が入っていて、取り込みを上げる commit が毎回止まるため。
# 自分で書いたスキルの正本（.rulesync/skills/<名前>/）は見る。生成物は正本の写しなので見なくてよい。
# .claude/skills を正本として手で書いているリポジトリ（rulesync を使わない物）には写さない（自分のスキルが見られなくなる）
[[allowlists]]
description = "取り込んだ外部のスキルと、スキルの生成物"
paths = [
  '''(^|/)\.rulesync/skills/\.curated/''',
  '''(^|/)\.claude/skills/''',
  '''(^|/)\.agents/skills/''',
]
